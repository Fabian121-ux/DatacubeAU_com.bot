services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - datacube
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  bootstrap:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    command: ["python", "worker_cli.py", "bootstrap"]
    networks:
      - datacube

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WAHA_SERVICE_URL: ${WAHA_SERVICE_URL:-http://waha:3000}
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 5
    networks:
      - datacube
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waha:
    image: ${WAHA_IMAGE:?Set WAHA_IMAGE in .env.production}
    restart: unless-stopped
    init: true
    shm_size: "512m"
    env_file:
      - .env.production
    environment:
      WHATSAPP_API_KEY: ${WAHA_API_KEY}
      WHATSAPP_HOOK_URL: ${WHATSAPP_HOOK_URL:-http://api:8080/webhooks/waha}
      WHATSAPP_HOOK_EVENTS: ${WHATSAPP_HOOK_EVENTS:-message}
      WHATSAPP_HOOK_RETRIES_POLICY: ${WHATSAPP_HOOK_RETRIES_POLICY:-linear}
      WHATSAPP_HOOK_RETRIES_DELAY_SECONDS: ${WHATSAPP_HOOK_RETRIES_DELAY_SECONDS:-2}
      WHATSAPP_HOOK_RETRIES_ATTEMPTS: ${WHATSAPP_HOOK_RETRIES_ATTEMPTS:-6}
      WAHA_AUTO_START_DELAY_SECONDS: ${WAHA_AUTO_START_DELAY_SECONDS:-5}
      WHATSAPP_RESTART_ALL_SESSIONS: ${WHATSAPP_RESTART_ALL_SESSIONS:-true}
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "node", "-e", "const options = { headers: {} }; if (process.env.WHATSAPP_API_KEY) options.headers['X-Api-Key'] = process.env.WHATSAPP_API_KEY; require('http').get('http://127.0.0.1:3000/api/server/status', options, (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 40s
    volumes:
      - waha_data:${WAHA_CONTAINER_DATA_PATH:-/app/.sessions}
      - waha_media:${WHATSAPP_FILES_FOLDER:-/app/.media}
    networks:
      - datacube
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  outbound-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WAHA_SERVICE_URL: ${WAHA_SERVICE_URL:-http://waha:3000}
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "worker_cli.py", "outbound"]
    networks:
      - datacube
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  waha-monitor:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      WAHA_SERVICE_URL: ${WAHA_SERVICE_URL:-http://waha:3000}
    depends_on:
      postgres:
        condition: service_healthy
      waha:
        condition: service_healthy
      api:
        condition: service_healthy
    command: ["python", "worker_cli.py", "monitor"]
    networks:
      - datacube
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${PUBLIC_HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - datacube
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:80/health >/dev/null || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    command: ["/bin/sh", "/srv/app/deploy/scripts/run-migrations.sh"]
    networks:
      - datacube


volumes:
  postgres_data:
  waha_data:
  waha_media:
    driver: local

networks:
  datacube:
    driver: bridge
