name: Tests

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test:
    name: pytest with coverage
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: datacube_bot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d datacube_bot_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PYTHONPATH: ${{ github.workspace }}/bot_core
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/datacube_bot_test
      DATABASE_URL_SYNC: postgresql://postgres:postgres@localhost:5432/datacube_bot_test
      ADMIN_API_TOKEN: test-admin-token
      STARTUP_VALIDATE_DB: "false"
      AI_ENABLED: "false"
      WAHA_SERVICE_URL: http://127.0.0.1:3999
      WAHA_SESSION_NAME: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio pytest-cov respx

      - name: Apply database migrations
        run: |
          psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -f bot_core/migrations/001_init.sql
          psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -f bot_core/migrations/002_expand_v1.sql
          psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -f bot_core/migrations/003_assistant_layer.sql
          psql "$DATABASE_URL_SYNC" -v ON_ERROR_STOP=1 -f bot_core/migrations/004_nextgen_intelligence.sql

      - name: Verify tests directory exists
        run: |
          if [ ! -d tests ]; then
            echo "::error::tests/ directory is missing. Add tests before relying on this workflow."
            exit 1
          fi

      - name: Run tests with coverage
        run: |
          pytest tests \
            --cov=bot_core/app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
