name: Zina Strix Security Scan

on:
  pull_request:
    paths:
      - ".github/workflows/strix-security.yml"
      - ".strix/instructions.md"
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Strix scan mode for the local Zina source tree
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard
      max_budget:
        description: Maximum Strix LLM budget for this authorized local scan
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: zina-strix-security-${{ github.ref }}
  cancel-in-progress: false

jobs:
  policy-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Zina
        uses: actions/checkout@v4

      - name: Verify fail-closed local-only scope
        shell: bash
        run: |
          set -euo pipefail
          test -f .strix/instructions.md
          grep -Fq 'Only the checked-out `Fabian121-ux/DatacubeAU_com.bot` repository content' .strix/instructions.md
          grep -Fq 'production Zina services' .strix/instructions.md
          grep -Fq 'real WhatsApp accounts' .strix/instructions.md
          grep -Fq 'Do not perform destructive data deletion' .strix/instructions.md

          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/strix-security.yml').read_text(encoding='utf-8')
          target_lines = [
              line.strip()
              for line in workflow.splitlines()
              if line.strip().startswith('--target ')
          ]
          expected = '--target "$GITHUB_WORKSPACE" \\'
          if target_lines != [expected]:
              raise SystemExit(
                  'Strix workflow must contain exactly one local repository target: '
                  '--target "$GITHUB_WORKSPACE". Network or alternate targets require '
                  'separate explicit staging authorization.'
              )
          PY

  local-repo-security-scan:
    if: github.event_name == 'workflow_dispatch'
    needs: policy-validation
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Zina
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate authorized scope and scan controls
        shell: bash
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          MAX_BUDGET: ${{ inputs.max_budget }}
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Fabian121-ux/DatacubeAU_com.bot"

          case "$SCAN_MODE" in
            quick|standard) ;;
            *) echo "Unsupported scan mode" >&2; exit 2 ;;
          esac

          if ! [[ "$MAX_BUDGET" =~ ^[0-9]+$ ]] || [ "$MAX_BUDGET" -lt 1 ] || [ "$MAX_BUDGET" -gt 25 ]; then
            echo "max_budget must be an integer from 1 to 25" >&2
            exit 2
          fi

          if [ -z "${STRIX_LLM:-}" ] || [ -z "${LLM_API_KEY:-}" ]; then
            echo "Strix requires repository secrets STRIX_LLM and LLM_API_KEY." >&2
            exit 2
          fi

          test -f .strix/instructions.md
          test -d bot_core
          test -f requirements.txt
          test -f pyproject.toml
          test -f Dockerfile
          test -f docker-compose.yml
          docker info >/dev/null

      - name: Install pinned Strix CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'strix-agent==1.4.1'
          strix --version

      - name: Run bounded local-code pentest
        shell: bash
        env:
          SCAN_MODE: ${{ inputs.scan_mode }}
          MAX_BUDGET: ${{ inputs.max_budget }}
          STRIX_LLM: ${{ secrets.STRIX_LLM }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: |
          set -euo pipefail
          strix \
            --non-interactive \
            --target "$GITHUB_WORKSPACE" \
            --scan-mode "$SCAN_MODE" \
            --max-budget "$MAX_BUDGET" \
            --instruction-file "$GITHUB_WORKSPACE/.strix/instructions.md"

      - name: Verify Strix completed normally
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_json=$(find strix_runs -mindepth 2 -maxdepth 2 -name run.json -type f -print 2>/dev/null | xargs -r ls -1t | head -1)
          if [ -z "${run_json:-}" ]; then
            echo "No Strix run.json was produced." >&2
            exit 1
          fi

          status=$(python - "$run_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              print(json.load(f).get('status', 'unknown'))
          PY
          )
          echo "Strix run status: $status"
          if [ "$status" != "completed" ]; then
            echo "Strix did not complete normally." >&2
            exit 1
          fi
