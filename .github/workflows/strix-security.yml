name: Zina Strix Security Scan

on:
  workflow_dispatch:
    inputs:
      scan_mode:
        description: Strix scan mode for the local Zina source tree
        required: true
        default: quick
        type: choice
        options:
          - quick
          - standard
      max_budget:
        description: Maximum Strix LLM budget for this authorized local scan
        required: true
        default: "10"
        type: string

permissions:
  contents: read

concurrency:
  group: zina-strix-security
  cancel-in-progress: false

jobs:
  local-repo-security-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      STRIX_LLM: ${{ secrets.STRIX_LLM }}
      LLM_API_KEY: ${{ secrets.LLM_API_KEY }}

    steps:
      - name: Check out Zina
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate authorized scope and scan controls
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "Fabian121-ux/DatacubeAU_com.bot"

          case "${{ inputs.scan_mode }}" in
            quick|standard) ;;
            *) echo "Unsupported scan mode" >&2; exit 2 ;;
          esac

          budget='${{ inputs.max_budget }}'
          if ! [[ "$budget" =~ ^[0-9]+$ ]] || [ "$budget" -lt 1 ] || [ "$budget" -gt 25 ]; then
            echo "max_budget must be an integer from 1 to 25" >&2
            exit 2
          fi

          if [ -z "${STRIX_LLM:-}" ] || [ -z "${LLM_API_KEY:-}" ]; then
            echo "Strix requires repository secrets STRIX_LLM and LLM_API_KEY." >&2
            exit 2
          fi

          test -f .strix/instructions.md
          test -d bot_core
          docker info >/dev/null

      - name: Install pinned Strix CLI
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir 'strix-agent==1.4.1'
          strix --version

      - name: Run bounded local-code pentest
        shell: bash
        run: |
          set -euo pipefail
          strix \
            --non-interactive \
            --target "$GITHUB_WORKSPACE/bot_core" \
            --scan-mode '${{ inputs.scan_mode }}' \
            --max-budget '${{ inputs.max_budget }}' \
            --instruction-file "$GITHUB_WORKSPACE/.strix/instructions.md"

      - name: Verify Strix completed normally
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          run_json=$(find strix_runs -mindepth 2 -maxdepth 2 -name run.json -type f -print 2>/dev/null | xargs -r ls -1t | head -1)
          if [ -z "${run_json:-}" ]; then
            echo "No Strix run.json was produced." >&2
            exit 1
          fi

          status=$(python - "$run_json" <<'PY'
          import json, sys
          with open(sys.argv[1], encoding='utf-8') as f:
              print(json.load(f).get('status', 'unknown'))
          PY
          )
          echo "Strix run status: $status"
          if [ "$status" != "completed" ]; then
            echo "Strix did not complete normally." >&2
            exit 1
          fi
